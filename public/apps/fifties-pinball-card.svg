<svg xmlns="http://www.w3.org/2000/svg" width="320" height="196" viewBox="0 0 320 196" fill="none" role="img" aria-label="Fifties Flipper pinball table">
  <defs>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5a3a24"/>
      <stop offset="1" stop-color="#2a1a10"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4e8c9"/>
      <stop offset="1" stop-color="#dcc79a"/>
    </linearGradient>
    <linearGradient id="marquee" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d63b3f"/>
      <stop offset="1" stop-color="#a81f24"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d8dde6"/>
      <stop offset="1" stop-color="#6f7684"/>
    </radialGradient>
  </defs>

  <rect width="320" height="196" fill="#14100e"/>
  <rect x="16" y="10" width="288" height="176" rx="18" fill="url(#cab)" stroke="#e9b44c" stroke-width="3"/>

  <!-- marquee -->
  <rect x="30" y="20" width="260" height="34" rx="10" fill="url(#marquee)" stroke="#ffd987" stroke-width="2"/>
  <text x="160" y="43" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#fff4d6">FIFTIES FLIPPER</text>

  <!-- playfield -->
  <rect x="46" y="62" width="228" height="114" rx="8" fill="url(#field)" stroke="#c9c2b4" stroke-width="3"/>

  <!-- printed arcs -->
  <path d="M74 108 A86 60 0 0 1 246 108" fill="none" stroke="#c1272d" stroke-width="2" opacity="0.5"/>
  <path d="M86 120 A74 48 0 0 1 234 120" fill="none" stroke="#1f3a5f" stroke-width="2" opacity="0.45"/>

  <!-- bumpers -->
  <circle cx="112" cy="106" r="14" fill="#c1272d" stroke="#8f1b1f" stroke-width="3"/>
  <circle cx="112" cy="106" r="6" fill="#e9b44c"/>
  <circle cx="208" cy="106" r="14" fill="#c1272d" stroke="#8f1b1f" stroke-width="3"/>
  <circle cx="208" cy="106" r="6" fill="#e9b44c"/>
  <circle cx="160" cy="132" r="14" fill="#c1272d" stroke="#8f1b1f" stroke-width="3"/>
  <circle cx="160" cy="132" r="6" fill="#e9b44c"/>

  <!-- drop targets -->
  <rect x="120" y="74" width="20" height="6" rx="2" fill="#c1272d"/>
  <rect x="150" y="74" width="20" height="6" rx="2" fill="#c1272d"/>
  <rect x="180" y="74" width="20" height="6" rx="2" fill="#c1272d"/>

  <!-- slingshots -->
  <path d="M62 128 L92 156 L62 156 Z" fill="#e9b44c" stroke="#1f3a5f" stroke-width="2"/>
  <path d="M258 128 L228 156 L258 156 Z" fill="#e9b44c" stroke="#1f3a5f" stroke-width="2"/>

  <!-- flippers -->
  <line x1="120" y1="164" x2="150" y2="170" stroke="#2a9d8f" stroke-width="9" stroke-linecap="round"/>
  <line x1="200" y1="164" x2="170" y2="170" stroke="#2a9d8f" stroke-width="9" stroke-linecap="round"/>

  <!-- ball -->
  <circle cx="176" cy="94" r="7" fill="url(#ball)" stroke="#3b4048" stroke-width="1"/>
</svg>
