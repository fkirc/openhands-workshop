<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bs-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a1a0a"/>
      <stop offset="1" stop-color="#0b0703"/>
    </linearGradient>
    <linearGradient id="bs-gold" x1="150" y1="120" x2="380" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7dd9a"/>
      <stop offset="1" stop-color="#c8912f"/>
    </linearGradient>
    <clipPath id="bs-clip">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bs-clip)">
    <rect width="512" height="512" fill="url(#bs-bg)"/>

    <!-- crossbones -->
    <g fill="url(#bs-gold)" opacity="0.92">
      <g transform="rotate(45 256 262)">
        <rect x="70" y="245" width="372" height="34" rx="17"/>
        <circle cx="78" cy="246" r="24"/>
        <circle cx="78" cy="278" r="24"/>
        <circle cx="434" cy="246" r="24"/>
        <circle cx="434" cy="278" r="24"/>
      </g>
      <g transform="rotate(-45 256 262)">
        <rect x="70" y="245" width="372" height="34" rx="17"/>
        <circle cx="78" cy="246" r="24"/>
        <circle cx="78" cy="278" r="24"/>
        <circle cx="434" cy="246" r="24"/>
        <circle cx="434" cy="278" r="24"/>
      </g>
    </g>

    <!-- skull -->
    <g>
      <path d="M256 92c-79 0-140 58-140 132 0 47 25 82 58 103 12 7 18 15 18 29v18c0 20 15 36 35 36h58c20 0 35-16 35-36v-18c0-14 6-22 18-29 33-21 58-56 58-103 0-74-61-132-140-132z" fill="url(#bs-gold)"/>
      <!-- eyes -->
      <ellipse cx="205" cy="222" rx="34" ry="40" fill="#120a03"/>
      <ellipse cx="307" cy="222" rx="34" ry="40" fill="#120a03"/>
      <!-- nose -->
      <path d="M256 268l-18 40h36z" fill="#120a03"/>
      <!-- jaw line + teeth -->
      <rect x="196" y="330" width="120" height="14" rx="7" fill="#120a03"/>
      <rect x="216" y="330" width="10" height="52" rx="4" fill="#120a03"/>
      <rect x="242" y="330" width="10" height="60" rx="4" fill="#120a03"/>
      <rect x="268" y="330" width="10" height="60" rx="4" fill="#120a03"/>
      <rect x="294" y="330" width="10" height="52" rx="4" fill="#120a03"/>
    </g>
  </g>
</svg>
