<svg width="320" height="196" viewBox="0 0 320 196" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bs-sky" x1="0" y1="0" x2="320" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a1f10"/>
      <stop offset="0.55" stop-color="#1c0f06"/>
      <stop offset="1" stop-color="#0a0603"/>
    </linearGradient>
    <linearGradient id="bs-sea" x1="0" y1="120" x2="0" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#241a2e"/>
      <stop offset="1" stop-color="#0a0710"/>
    </linearGradient>
    <linearGradient id="bs-gold" x1="0" y1="0" x2="320" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7dd9a"/>
      <stop offset="1" stop-color="#c8912f"/>
    </linearGradient>
    <radialGradient id="bs-moon" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(258 46) scale(34)">
      <stop stop-color="#fdf3d0"/>
      <stop offset="1" stop-color="#fdf3d0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bs-card-clip">
      <rect width="320" height="196" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bs-card-clip)">
    <rect width="320" height="196" fill="url(#bs-sky)"/>
    <circle cx="258" cy="46" r="34" fill="url(#bs-moon)"/>
    <circle cx="258" cy="46" r="16" fill="#fdf3d0" opacity="0.9"/>

    <!-- sea -->
    <rect y="118" width="320" height="78" fill="url(#bs-sea)"/>
    <g stroke="#4b5a8a" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
      <path d="M8 140h44M64 140h30M112 140h52M180 140h40M236 140h56"/>
      <path d="M28 156h40M84 156h60M160 156h44M220 156h64"/>
      <path d="M12 172h60M92 172h52M160 172h48M224 172h70"/>
    </g>

    <!-- ship silhouette -->
    <g fill="#050308">
      <path d="M232 118h56l-10 14h-36z"/>
      <rect x="258" y="66" width="3" height="52"/>
      <path d="M261 70c14 8 22 20 22 34h-22z"/>
      <path d="M258 76c-12 6-18 16-18 28h18z" opacity="0.85"/>
      <path d="M254 52l6 14 6-14z"/>
    </g>

    <!-- parchment map -->
    <g transform="translate(20 40) rotate(-4)">
      <rect x="0" y="0" width="150" height="118" rx="8" fill="#e8d5a3"/>
      <rect x="0" y="0" width="150" height="118" rx="8" fill="none" stroke="#b08a4c" stroke-width="3"/>
      <g stroke="#b08a4c" stroke-width="2" fill="none" opacity="0.85">
        <path d="M16 88c18-30 30 6 46-14s26 10 44-16"/>
        <path d="M16 88c14-22 26-2 40-16" stroke-dasharray="5 5"/>
        <path d="M60 30c10 8 24 6 34 16" stroke-dasharray="5 5"/>
      </g>
      <g fill="#a3773f" opacity="0.9">
        <path d="M40 40l6 10-6 10-6-10z"/>
        <path d="M92 62l5 9-5 9-5-9z"/>
      </g>
      <!-- X marks the spot -->
      <g stroke="#b0231f" stroke-width="7" stroke-linecap="round">
        <path d="M104 74l22 22M126 74l-22 22"/>
      </g>
      <!-- compass rose -->
      <g transform="translate(30 100)" stroke="#a3773f" stroke-width="2" fill="#a3773f">
        <circle r="12" fill="none"/>
        <path d="M0-16l4 12-4 4-4-4z"/>
        <path d="M0 16l-4-12 4-4 4 4z"/>
